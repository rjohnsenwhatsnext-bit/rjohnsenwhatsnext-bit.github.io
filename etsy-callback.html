<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Etsy connected</title>
<style>
:root { --bg:#f6f1ea; --ink:#2b2a28; --soft:#7a6a58; --card:#fff; }
@media (prefers-color-scheme: dark) { :root { --bg:#1d1a17; --ink:#f3ece3; --soft:#b5a690; --card:#2a2622; } }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; padding:32px 16px; }
main { max-width:480px; margin:0 auto; background:var(--card); border-radius:14px; padding:24px; }
h1 { font-size:22px; margin:0 0 8px; }
p { color:var(--soft); margin:0 0 16px; }
code { display:block; word-break:break-all; background:var(--bg); padding:14px; border-radius:10px; font-size:14px; color:var(--ink); }
button { margin-top:14px; width:100%; padding:14px; border:0; border-radius:10px; background:var(--ink); color:var(--bg); font-size:16px; font-weight:600; }
</style></head><body><main>
<h1 id="t">Etsy said yes</h1>
<p id="m">Copy this whole line and paste it to Claude. It only works once and runs out in a few minutes.</p>
<code id="c"></code>
<button id="b">Copy</button>
</main><script>
const q = new URLSearchParams(location.search);
const c = document.getElementById('c'), b = document.getElementById('b');
if (q.get('error')) {
  document.getElementById('t').textContent = 'Etsy did not connect';
  document.getElementById('m').textContent = 'Etsy said: ' + (q.get('error_description') || q.get('error')) + '. Tell Claude what it says.';
  c.textContent = q.get('error'); b.hidden = true;
} else if (!q.get('code')) {
  document.getElementById('t').textContent = 'Nothing to copy';
  document.getElementById('m').textContent = 'This page is where Etsy sends you back after you press Allow. Open the link Claude gave you first.';
  c.hidden = true; b.hidden = true;
} else {
  c.textContent = 'etsy ' + q.get('code') + ' ' + (q.get('state') || '');
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(c.textContent); b.textContent = 'Copied'; }
    catch (e) { b.textContent = 'Copy failed: press and hold the text instead'; }
  };
}
</script></body></html>
